packages:
  - 'packages/*'
  - 'apps/*'

# unrs-resolver (native resolver behind eslint-config-expo's import plugin) ships
# prebuilt binaries as platform-specific optional deps; its postinstall is only a
# build-from-source fallback, so it stays denied.
allowBuilds:
  unrs-resolver: false

minimumReleaseAge: 4320 # 3-day cooldown — supply-chain attack mitigation

# First-party YouVersion packages are exempt from the cooldown. The cooldown
# buys time for the ecosystem to spot a hijacked *third-party* release; for the
# Web SDK we publish ourselves, it only blocks us from consuming our own work on
# release day. The tradeoff is real and deliberate: a compromised YouVersion npm
# token would reach our builds with no waiting period, so these packages lean on
# publish-side controls (2FA/trusted publishing) rather than this cooldown.
minimumReleaseAgeExclude:
  - '@youversion/*'

# Migrated from .npmrc — pnpm 11 only reads auth/registry settings from .npmrc,
# all other settings must live here (https://pnpm.io/blog/releases/11.0).
# Required for Expo DOM Components + pnpm compatibility.
nodeLinker: hoisted

# Pin transitive Expo SDK 57 deps to versions past the 3-day minimumReleaseAge
# cutoff while SDK 57.0.23+ patches age out (see PR-1 upgrade notes).
overrides:
  '@expo/cli': 57.0.24
  '@expo/router-server': 57.0.9
  babel-preset-expo: 57.0.11
  expo: 57.0.22
  expo-build-properties: 57.0.17
