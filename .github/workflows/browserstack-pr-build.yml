name: BrowserStack App Live PR Build

# React Native (Expo) translation of the Swift SDK automation repo's bridge
# of the same name (platform-sdk-swift#226/#228, YPE-3011): when an approved
# automation-repository collaborator opens a same-repository PR, dispatch the
# existing SDK build for the PR's exact head SHA and upload the resulting
# Android .apk AND iOS .ipa to BrowserStack App Live. Later builds are
# requested deliberately by an approved collaborator commenting one of
# /app-live (both platforms), /app-live-ios, or /app-live-android on the open
# PR, each optionally followed by the full sha being approved. For that
# issue_comment path, the approved commenter authorizes one exact
# same-repository revision; the PR author does not also need
# automation-repository access. Test automation and App Automate
# execution are deliberately out of scope.
#
# Unlike the Swift/Kotlin bridges, the automation workflow here
# (build-rn-app.yml) requires a `platform` input and runs two jobs (android,
# ios) per dispatch. The initial PR-open build always requests platform: both
# so every PR gets both artifacts tested; the /app-live-ios and
# /app-live-android comments narrow a rebuild to one platform (cheaper,
# faster — matching build-rn-app.yml's own guidance to pick a single target
# when iterating), while bare /app-live still means both.
#
# pull_request_target, NOT pull_request: this workflow consumes
# AUTOMATION_DISPATCH_TOKEN. A plain `pull_request` trigger runs the workflow
# definition AS IT EXISTS ON THE PR HEAD — for a same-repository PR (not just
# forks) that means a PR author could edit this very file to exfiltrate the
# secret before the authorization check below ever runs, since the check
# itself is the first code that touches the token. pull_request_target always
# runs the version of this file committed to the base branch, so a PR cannot
# rewrite the logic that guards its own token access. This workflow never
# checks out or executes the PR's application code — it only reads
# github.event.pull_request JSON metadata and dispatches a REMOTE build by
# value — so pull_request_target's usual "don't run untrusted code" caveat
# doesn't apply here. Trade-off: unlike pull_request, pull_request_target
# only runs the version already merged to the base branch, so this specific
# workflow file can no longer prove itself by triggering on its own PR being
# opened — verify future changes via a follow-up PR (or an /app-live
# comment, which already only ever loaded from the default branch).

on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  AUTOMATION_REPO: youversion/platform-sdk-reactnative-expo_automation
  WORKFLOW_FILE: build-rn-app.yml

concurrency:
  group: app-live-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  app-live-build:
    name: Build example app for App Live
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # The comment condition is a deliberately loose PREFIX match. Actions
    # expressions have no trim(), so an exact list membership test here
    # silently ignores the overwhelmingly common `/app-live ` (trailing space
    # or newline) — the user sees no response at all and no log to explain it.
    # The exact match therefore moves into the first step, where the body can
    # be normalized in the shell; anything that starts with /app-live but is
    # not one of the three commands is refused there with a notice. Prefix,
    # not `contains`: this workflow's own status comment quotes the commands,
    # and a contains() trigger would re-fire the job on every one of those.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/app-live'))

    steps:
      - name: Read current PR context
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GITHUB_EVENT_PATH is the runner-provided default env var — the
          # ${{ github.event_path }} expression resolved empty at runtime in
          # the Swift bridge this was ported from (platform-sdk-swift#228).
          REQUESTED_SHA=""
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            PR_JSON=$(jq '.pull_request' "$GITHUB_EVENT_PATH")
            PLATFORM="both"
            # No command to validate on the open event.
            COMMAND_OK=true
          else
            PR_NUMBER=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
            PR_JSON=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")

            # The job-level `if` only proved the body STARTS WITH /app-live, so
            # this is where a command becomes exact. Normalize (strip CRs, then
            # leading/trailing whitespace) so `/app-live ` works, then match.
            #
            # The unrecognized branch MUST refuse. While the job-level `if` was
            # an exact three-string membership test, defaulting an unmatched
            # body to "both" was unreachable. Under a prefix trigger it is very
            # reachable: `/app-live-widnows` now arrives here, and defaulting
            # would silently build both platforms off a typo — the fix making
            # things worse than the bug it fixes.
            #
            # Six accepted forms: each of the three commands bare, or followed
            # by a full commit sha that binds the approval to one revision. See
            # the "Bind the approval to a revision" step below for which form
            # is required when.
            CMD=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH" | tr -d '\r')
            CMD=$(printf '%s' "$CMD" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
            # Echo a sanitized single-line excerpt, never the raw body: a
            # comment is untrusted input, and echoing it verbatim would let
            # it emit its own ::workflow commands:: into this step's log.
            SAFE_CMD=$(printf '%s' "$CMD" |
              sed -n '1p' | cut -c1-60 | sed 's/::/;;/g')
            # A command is one line. wc -l counts newlines, and printf '%s'
            # adds none, so >0 means the body carries trailing prose.
            if [ "$(printf '%s' "$CMD" | wc -l)" -gt 0 ]; then
              CMD="$SAFE_CMD …"
            fi

            VERB="$CMD"
            ARG=""
            case "$CMD" in
              *" "*)
                VERB="${CMD%% *}"
                ARG=$(printf '%s' "${CMD#* }" | sed -E 's/^[[:space:]]+//')
                ;;
            esac

            COMMAND_OK=true
            case "$VERB" in
              /app-live)         PLATFORM="both" ;;
              /app-live-ios)     PLATFORM="ios" ;;
              /app-live-android) PLATFORM="android" ;;
              *)
                # Never "both" here — see the note above.
                PLATFORM="none"
                COMMAND_OK=false
                echo "::notice::Ignoring unrecognized command '$SAFE_CMD'."
                ;;
            esac

            # The sha must be all 40 characters. An abbreviation could only be
            # matched as a prefix, and a 7-character prefix is 28 bits:
            # grinding a second commit that shares it is ordinary vanity-hash
            # work, and the author can pre-compute it against their own
            # commit's prefix before the approval is ever posted. Accepting
            # abbreviations would hand back the exact race the binding step
            # removes, so they are refused, not resolved.
            if [ "$COMMAND_OK" = "true" ] && [ -n "$ARG" ]; then
              if printf '%s' "$ARG" | grep -qE '^[0-9a-fA-F]{40}$'; then
                REQUESTED_SHA=$(printf '%s' "$ARG" | tr '[:upper:]' '[:lower:]')
              elif printf '%s' "$ARG" | grep -qE '^[0-9a-fA-F]{1,39}$'; then
                COMMAND_OK=false
                PLATFORM="none"
                echo "::notice::'$SAFE_CMD' names an abbreviated commit. Abbreviations are matched as prefixes and a short prefix can be deliberately collided, so the full 40-character sha is required."
              else
                COMMAND_OK=false
                PLATFORM="none"
                echo "::notice::'$SAFE_CMD' is not a recognized command. Use \`/app-live\`, \`/app-live-ios\`, or \`/app-live-android\`, optionally followed by a full 40-character commit sha."
              fi
            fi
          fi

          PR_NUMBER=$(jq -r '.number' <<< "$PR_JSON")
          PR_AUTHOR=$(jq -r '.user.login' <<< "$PR_JSON")
          HEAD_REF=$(jq -r '.head.ref' <<< "$PR_JSON")
          HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$PR_JSON")
          HEAD_SHA=$(jq -r '.head.sha' <<< "$PR_JSON")
          PR_STATE=$(jq -r '.state' <<< "$PR_JSON")

          {
            echo "number=$PR_NUMBER"
            echo "author=$PR_AUTHOR"
            echo "head_ref=$HEAD_REF"
            echo "head_sha=$HEAD_SHA"
            echo "platform=$PLATFORM"
            echo "same_repo=$([ "$HEAD_REPO" = "$REPOSITORY" ] && echo true || echo false)"
            echo "open=$([ "$PR_STATE" = "open" ] && echo true || echo false)"
            echo "command_ok=$COMMAND_OK"
            echo "requested_sha=$REQUESTED_SHA"
          } >> "$GITHUB_OUTPUT"

      # An /app-live comment authorizes the ACTOR. It does not, by itself,
      # authorize a REVISION: issue_comment payloads carry no head SHA, so the
      # step above has to read the head from the pulls API when this workflow
      # runs — which is not when the comment was posted. The PR author can push
      # in between and inherit the approval for a commit the approver never
      # saw. The window is not milliseconds: the concurrency group above is
      # per-PR with cancel-in-progress false, so a comment run can queue behind
      # an in-flight build of the same PR for that build's full duration.
      #
      # That matters because this path deliberately does NOT require the PR
      # author to hold automation-repository access — the dispatch runs the PR's
      # source through the automation repository's build, so winning the race
      # converts "write on this repo" into "code execution with the automation
      # repository's secrets".
      #
      # The binding is proportional to what the race can actually gain:
      #   - pull_request_target: bound already. The event payload carries the
      #     exact revision that fired it; a later push cannot change it.
      #   - a command with a sha: bound by the commenter naming the revision.
      #     The named sha must equal the head exactly, so a push after the
      #     comment refuses the build instead of silently retargeting it.
      #   - a bare command: bound only when the PR author is themselves an
      #     approved automation collaborator, because then winning the race
      #     grants them nothing they could not already do directly.
      # Otherwise a bare command is refused, with the sha to re-issue.
      #
      # Deliberately NOT time-based: comparing the head commit's date against
      # the comment's created_at looks equivalent and is not, because
      # GIT_COMMITTER_DATE is set by whoever writes the commit. The exact
      # attacker this guards against can backdate their push.
      - name: Bind the approval to a revision
        if: >-
          steps.pr.outputs.same_repo == 'true' &&
          steps.pr.outputs.open == 'true' &&
          steps.pr.outputs.command_ok == 'true'
        id: binding
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          REQUESTED_SHA: ${{ steps.pr.outputs.requested_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "bound=true" >> "$GITHUB_OUTPUT"
            echo "Bound to $HEAD_SHA by the event payload."
            exit 0
          fi

          # String equality on the full 40 characters, never a prefix test: a
          # prefix test is what a ground colliding commit defeats. The parser
          # above already refused anything shorter.
          if [ -n "$REQUESTED_SHA" ]; then
            if [ "$REQUESTED_SHA" = "$HEAD_SHA" ]; then
              echo "bound=true" >> "$GITHUB_OUTPUT"
              echo "Bound to $HEAD_SHA by explicit approval of that revision."
            else
              echo "bound=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Approval named '$REQUESTED_SHA' but PR head is now $HEAD_SHA — build refused. Re-issue the command with \`$HEAD_SHA\` to approve the current head."
            fi
            exit 0
          fi

          # Bare command. Fail closed on a lookup failure, same contract as the
          # actor check below: "could not ask" is treated as "no".
          AUTHOR_PERMISSION=$(gh api \
            "repos/$AUTOMATION_REPO/collaborators/$PR_AUTHOR/permission" \
            --jq '.permission') || AUTHOR_PERMISSION=""

          case "$AUTHOR_PERMISSION" in
            admin|maintain|write)
              echo "bound=true" >> "$GITHUB_OUTPUT"
              echo "PR author '$PR_AUTHOR' holds '$AUTHOR_PERMISSION' on $AUTOMATION_REPO, so a race on the head grants no new access."
              ;;
            *)
              echo "bound=false" >> "$GITHUB_OUTPUT"
              echo "::notice::PR author '$PR_AUTHOR' is not an approved collaborator on $AUTOMATION_REPO, so a bare command cannot be bound to a revision. Re-issue it with \`$HEAD_SHA\` to approve this exact head."
              ;;
          esac

      # Gating this on `bound` keeps steps.authorization.outputs.allowed the
      # single condition every later step tests: allowed means an approved
      # actor authorized THIS revision.
      - name: Verify trigger actor is an approved automation collaborator
        if: >-
          steps.pr.outputs.same_repo == 'true' &&
          steps.pr.outputs.open == 'true' &&
          steps.pr.outputs.command_ok == 'true' &&
          steps.binding.outputs.bound == 'true'
        id: authorization
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The collaborator-permission endpoint can fail (404, transient
          # error, a caller-permission edge case) instead of cleanly
          # returning "none" for an unauthorized actor. Under `set -e` that
          # would kill this step before the case statement below ever runs,
          # turning "not authorized" into a misleading job failure instead of
          # the intended silent skip. Treat any lookup failure the same as an
          # explicit denial — fail closed, never fail loud.
          #
          # stderr is left unredirected so a lookup failure's actual error
          # (rate limit, network, unexpected shape) still lands in this
          # step's log for diagnosis — only stdout feeds PERMISSION.
          PERMISSION=$(gh api \
            "repos/$AUTOMATION_REPO/collaborators/$TRIGGER_ACTOR/permission" \
            --jq '.permission') || PERMISSION=""

          case "$PERMISSION" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "Trigger actor '$TRIGGER_ACTOR' is approved with '$PERMISSION' access to $AUTOMATION_REPO."
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              if [ -z "$PERMISSION" ]; then
                echo "::notice::Could not confirm '$TRIGGER_ACTOR' has access to $AUTOMATION_REPO (lookup failed) — App Live build skipped."
              else
                echo "::notice::Trigger actor '$TRIGGER_ACTOR' has '$PERMISSION' access to $AUTOMATION_REPO; App Live build skipped."
              fi
              ;;
          esac

      - name: Define remote build
        if: steps.authorization.outputs.allowed == 'true'
        id: build
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          SHA7=$(printf '%s' "$HEAD_SHA" | cut -c1-7)

          TICKET=$(printf '%s' "$HEAD_REF" | grep -Eio 'YPE-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          # pr<N> in the key scopes numbering to the PR, matching the
          # concurrency boundary: two PRs on one ticket can otherwise race
          # the same max and dispatch identical names.
          if [ -n "$TICKET" ]; then
            BUILD_KEY="$TICKET-pr$PR_NUMBER"
          else
            BRANCH_LABEL=${HEAD_REF#*/}
            BRANCH_KEY=$(printf '%s' "$BRANCH_LABEL" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' |
              cut -c1-10 |
              sed -E 's/-+$//')
            BUILD_KEY=${BRANCH_KEY:-branch}-pr$PR_NUMBER
          fi

          BUILD_PREFIX="rn-$BUILD_KEY-"
          # Paginate the full run history and use max existing N + 1: a
          # 100-run window lets an old ticket's counter reset, and counting
          # runs (rather than taking the max) can reuse a number after a run
          # is deleted.
          MAX_BUILD=$(gh api --paginate \
            "repos/$AUTOMATION_REPO/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].display_title' |
            grep -E "^${BUILD_PREFIX}[0-9]+ " |
            sed -E "s/^${BUILD_PREFIX}([0-9]+) .*/\1/" |
            sort -n | tail -1 || true)
          BUILD_NUMBER=$(( ${MAX_BUILD:-0} + 1 ))
          BUILD_NAME="$BUILD_PREFIX$BUILD_NUMBER"

          {
            echo "name=$BUILD_NAME"
            echo "key=$BUILD_KEY"
            echo "number=$BUILD_NUMBER"
            echo "sha7=$SHA7"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch exact PR head to App Live
        if: steps.authorization.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          BUILD_NAME: ${{ steps.build.outputs.name }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PLATFORM: ${{ steps.pr.outputs.platform }}
        run: |
          set -euo pipefail
          jq -n \
            --arg sdk_ref "$HEAD_SHA" \
            --arg platform "$PLATFORM" \
            --arg build_name "$BUILD_NAME" \
            '{
              ref: "main",
              inputs: {
                sdk_ref: $sdk_ref,
                platform: $platform,
                target: "app-live",
                build_name: $build_name
              }
            }' |
            gh api \
              --method POST \
              "repos/$AUTOMATION_REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
              --input -
          echo "Dispatched '$BUILD_NAME' (platform: $PLATFORM) for exact SDK SHA $HEAD_SHA."

      - name: Locate remote build
        if: steps.authorization.outputs.allowed == 'true'
        id: remote
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          BUILD_NAME: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in $(seq 1 20); do
            RUN_ID=$(gh api \
              "repos/$AUTOMATION_REPO/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&per_page=20" \
              --jq ".workflow_runs[] | select(.display_title | startswith(\"$BUILD_NAME \")) | .id" |
              head -1)
            [ -n "$RUN_ID" ] && break
            sleep 3
          done

          test -n "$RUN_ID" || {
            echo "::error::Dispatched '$BUILD_NAME' but could not locate its automation run."
            exit 1
          }

          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$AUTOMATION_REPO/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for App Live upload
        if: steps.authorization.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          RUN_ID: ${{ steps.remote.outputs.id }}
        run: |
          set -euo pipefail
          while :; do
            STATUS=$(gh api "repos/$AUTOMATION_REPO/actions/runs/$RUN_ID" --jq '.status')
            [ "$STATUS" = "completed" ] && break
            echo "Remote build $RUN_ID: $STATUS"
            sleep 30
          done

          CONCLUSION=$(gh api "repos/$AUTOMATION_REPO/actions/runs/$RUN_ID" --jq '.conclusion')
          echo "Remote build $RUN_ID concluded: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::example app build or App Live upload failed ($CONCLUSION). With a two-platform dispatch, either job failing fails the whole run."
            exit 1
          fi

      - name: Read App Live ids
        if: steps.authorization.outputs.allowed == 'true'
        id: app_live
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          RUN_ID: ${{ steps.remote.outputs.id }}
          PLATFORM: ${{ steps.pr.outputs.platform }}
        run: |
          set -euo pipefail
          gh api "repos/$AUTOMATION_REPO/actions/runs/$RUN_ID/logs" > /tmp/remote-logs.zip
          unzip -oq /tmp/remote-logs.zip -d /tmp/remote-logs
          # build-rn-app.yml's Android/iOS jobs each notice their own App Live
          # id with a platform-tagged prefix (unlike Swift/Kotlin's single
          # "Uploaded to App Live: ..." line). Only read/require the id(s) for
          # the platform(s) actually dispatched — a /app-live-ios rebuild
          # never ran the Android job, so there's no Android id to find.
          ANDROID_ID=""
          IOS_ID=""
          if [ "$PLATFORM" = "android" ] || [ "$PLATFORM" = "both" ]; then
            ANDROID_ID=$(grep -rhoE 'Android → App Live: bs://[A-Za-z0-9]+' /tmp/remote-logs |
              head -1 | grep -oE 'bs://[A-Za-z0-9]+' || true)
            test -n "$ANDROID_ID" || {
              echo "::error::Remote build succeeded but its Android App Live bs:// id was not found."
              exit 1
            }
          fi
          if [ "$PLATFORM" = "ios" ] || [ "$PLATFORM" = "both" ]; then
            IOS_ID=$(grep -rhoE 'iOS → App Live: bs://[A-Za-z0-9]+' /tmp/remote-logs |
              head -1 | grep -oE 'bs://[A-Za-z0-9]+' || true)
            test -n "$IOS_ID" || {
              echo "::error::Remote build succeeded but its iOS App Live bs:// id was not found."
              exit 1
            }
          fi
          {
            echo "android_id=$ANDROID_ID"
            echo "ios_id=$IOS_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Publish App Live status on PR
        if: steps.authorization.outputs.allowed == 'true' && (steps.app_live.outputs.android_id != '' || steps.app_live.outputs.ios_id != '')
        env:
          ANDROID_APP_LIVE_ID: ${{ steps.app_live.outputs.android_id }}
          IOS_APP_LIVE_ID: ${{ steps.app_live.outputs.ios_id }}
          AUTOMATION_RUN_URL: ${{ steps.remote.outputs.url }}
          BUILD_NAME: ${{ steps.build.outputs.name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER='<!-- browserstack-app-live-status -->'
          SHA7=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          BODY=$(jq -nr \
            --arg marker "$MARKER" \
            --arg build "$BUILD_NAME" \
            --arg sha "$SHA7" \
            --arg run "$AUTOMATION_RUN_URL" \
            --arg android "$ANDROID_APP_LIVE_ID" \
            --arg ios "$IOS_APP_LIVE_ID" \
            '[
              $marker,
              "## BrowserStack App Live",
              "",
              "| Item | Value |",
              "|---|---|",
              ("| Build | `" + $build + "` |"),
              ("| Uploaded commit | `" + $sha + "` |"),
              ("| Automation run | [Open run](" + $run + ") |")
            ]
            + (if $android != "" then [("| Android App Live id | `" + $android + "` |")] else [] end)
            + (if $ios != "" then [("| iOS App Live id | `" + $ios + "` |")] else [] end)
            + [
              "",
              "Review-fix commits are not uploaded automatically. To upload the current PR head again, comment one of:",
              "",
              "`/app-live <sha>` (both platforms), `/app-live-ios <sha>`, `/app-live-android <sha>`",
              "",
              "Replace `<sha>` with the full 40-character sha of the head commit you are approving — abbreviations are refused, because a short prefix can be deliberately collided. Naming it binds the approval to that exact revision: if the head moves before the build starts, the build is refused rather than silently retargeted, and the log names the sha to re-issue. The bare form of each command is accepted when the PR author is themselves an approved collaborator on `platform-sdk-reactnative-expo_automation`.",
              "",
              "Only approved collaborators on `platform-sdk-reactnative-expo_automation` can trigger a build."
            ] | join("\n")')

          COMMENT_ID=$(gh api \
            "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"$MARKER\")) | .id" |
            head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/$REPOSITORY/issues/comments/$COMMENT_ID" \
              -f body="$BODY" >/dev/null
          else
            gh api --method POST \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$BODY" >/dev/null
          fi

      - name: Write summary
        if: always()
        env:
          ALLOWED: ${{ steps.authorization.outputs.allowed }}
          ANDROID_APP_LIVE_ID: ${{ steps.app_live.outputs.android_id }}
          IOS_APP_LIVE_ID: ${{ steps.app_live.outputs.ios_id }}
          BOUND: ${{ steps.binding.outputs.bound }}
          BUILD_NAME: ${{ steps.build.outputs.name }}
          COMMAND_OK: ${{ steps.pr.outputs.command_ok }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          IS_OPEN: ${{ steps.pr.outputs.open }}
          IS_SAME_REPO: ${{ steps.pr.outputs.same_repo }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ steps.remote.outputs.url }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## BrowserStack App Live build"
            echo ""
            if [ "$IS_SAME_REPO" != "true" ]; then
              echo "No build was dispatched because fork PRs cannot consume the cross-repository credential."
              exit 0
            fi
            if [ "$IS_OPEN" != "true" ]; then
              echo "No build was dispatched because PR #$PR_NUMBER is not open."
              exit 0
            fi
            if [ "$COMMAND_OK" != "true" ]; then
              echo "No build was dispatched because the comment was not a recognized \`/app-live\` command. See the job log for the command that was read."
              exit 0
            fi
            if [ "$BOUND" != "true" ]; then
              echo "No build was dispatched because the approval could not be bound to PR head \`$HEAD_SHA\`. See the job log for the sha to re-issue."
              exit 0
            fi
            if [ "$ALLOWED" != "true" ]; then
              echo "No build was dispatched because trigger actor $TRIGGER_ACTOR is not an approved collaborator on $AUTOMATION_REPO."
              exit 0
            fi
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| PR / SHA | #$PR_NUMBER @ $HEAD_SHA |"
            echo "| Build name | $BUILD_NAME |"
            echo "| Automation run | $RUN_URL |"
            [ -n "$ANDROID_APP_LIVE_ID" ] && echo "| Android App Live id | $ANDROID_APP_LIVE_ID |"
            [ -n "$IOS_APP_LIVE_ID" ] && echo "| iOS App Live id | $IOS_APP_LIVE_ID |"
            true
          } >> "$GITHUB_STEP_SUMMARY"
